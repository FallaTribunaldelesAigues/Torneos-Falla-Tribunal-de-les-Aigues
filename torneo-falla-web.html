<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneos de la Falla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF3DC;
    --paper-dark:#EFDFB6;
    --ink:#12331F;
    --red:#C1272D;
    --gold:#E3B23C;
    --orange:#E8672C;
    --green:#2F9E63;
    --felt:#0B5D3B;
    --felt-dark:#063822;
    --felt-light:#0F7047;
    --line: rgba(18,51,31,.16);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 50% -10%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .display{ font-family:'Anton',sans-serif; letter-spacing:.02em; text-transform:uppercase; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  header.top{
    padding:22px 18px 0;
    text-align:center;
  }
  .falla-logo{
    width:min(150px,38vw); height:auto; display:block; margin:0 auto 6px;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));
  }
  header.top .eyebrow{
    font-size:12px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--gold); font-weight:700; margin-bottom:4px;
  }
  header.top h1{
    font-size:clamp(32px,9vw,52px);
    margin:0; line-height:.92; color:var(--paper);
  }
  header.top h1 span{ color:var(--red); text-shadow:0 0 0 var(--red); }
  header.top .sub{
    margin-top:6px; font-size:13.5px; color:rgba(250,243,220,.72); max-width:480px; margin-left:auto;margin-right:auto;
  }

  .bunting{
    display:flex; justify-content:center; align-items:flex-start;
    overflow:hidden; margin-top:16px; padding-top:1px;
    border-top:2px solid rgba(250,243,220,.5);
  }
  .pennant{ width:0;height:0; border-left:8px solid transparent; border-right:8px solid transparent; margin:0 4px; flex:0 0 auto; }
  .p-red{ border-top:13px solid var(--red); }
  .p-gold{ border-top:13px solid var(--gold); }
  .p-ink{ border-top:13px solid var(--paper); }
  .p-orange{ border-top:13px solid var(--orange); }

  main{ padding:6px 14px 30px; max-width:720px; margin:0 auto; }

  .home-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .homebtn{
    background:var(--paper); border:2px solid var(--ink); border-radius:18px; padding:22px 10px 18px;
    text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px;
    box-shadow:0 6px 14px rgba(0,0,0,.18);
  }
  .homebtn:active{ transform:scale(.97); }
  .homebtn .bigdot{ width:54px;height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif; font-size:22px; color:var(--paper);
    box-shadow:0 0 0 3px var(--paper), 0 0 0 5px rgba(18,51,31,.25); }
  .homebtn .gname{ font-family:'Anton',sans-serif; text-transform:uppercase; font-size:18px; letter-spacing:.01em; }
  .homebtn .gstatus{ font-size:11.5px; color:#54607a; line-height:1.3; }
  .home-link{ display:block; text-align:center; margin-top:16px; font-size:13px; font-weight:700;
    color:var(--paper); text-decoration:underline; background:none; border:none; cursor:pointer; width:100%; }

  .topbar{ display:flex; align-items:center; gap:10px; padding:14px 2px 10px; }
  .backbtn{ background:none; border:none; color:var(--paper); font-weight:700; font-size:14px; cursor:pointer; padding:4px 2px; }
  .topbar-title{ flex:1; display:flex; align-items:center; gap:8px; font-family:'Anton',sans-serif;
    text-transform:uppercase; font-size:18px; color:var(--paper); }
  .topbar-title .dot.small{ width:22px;height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif; font-size:11px; color:var(--paper); flex:0 0 auto;
    box-shadow:0 0 0 2px rgba(250,243,220,.6); }
  .linkbtn{ background:none; border:none; color:var(--gold); font-weight:700; font-size:12.5px; cursor:pointer; text-decoration:underline; }

  .card{
    background:var(--paper); border:1.5px solid var(--line); border-top:4px solid var(--gold); border-radius:var(--radius);
    padding:16px; margin-bottom:14px; box-shadow:0 6px 16px rgba(0,0,0,.16);
  }
  .card h2{ font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:.02em;
    font-size:20px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .card h3{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:#54607a; margin:0 0 8px; font-weight:700;}

  .subtabbar{ display:flex; gap:6px; margin-bottom:14px; }
  .subtab{ flex:1; text-align:center; padding:8px 4px; border-radius:10px; border:none;
    background:var(--paper-dark); color:var(--ink); font-weight:600; font-size:13px; cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.15); }
  .subtab.active{ background:var(--ink); color:var(--paper); }

  form.row{ display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:4px; flex:1 1 120px; }
  .field label{ font-size:11.5px; font-weight:600; color:#54607a; }
  input,select{
    font-family:'Work Sans',sans-serif; font-size:14px; padding:9px 10px;
    border:1.5px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);
    width:100%;
  }
  input[type=number]{ font-family:'IBM Plex Mono',monospace; }
  button.btn{
    font-family:'Work Sans',sans-serif; font-weight:700; font-size:13.5px;
    background:var(--ink); color:var(--paper); border:none; border-radius:8px;
    padding:10px 16px; cursor:pointer; flex:0 0 auto;
  }
  button.btn.secondary{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
  button.btn.small{ padding:6px 10px; font-size:12px; }
  button.iconbtn{ background:none;border:none; color:#b0432f; cursor:pointer; font-size:15px; padding:2px 6px; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .chip{
    display:flex; align-items:center; gap:6px; background:var(--paper-dark);
    border-radius:999px; padding:6px 10px 6px 12px; font-size:13.5px; font-weight:600;
  }
  .chip .grp{ font-family:'IBM Plex Mono',monospace; background:var(--ink); color:var(--paper);
    border-radius:6px; padding:1px 6px; font-size:11px; }

  table.standings{ width:100%; border-collapse:collapse; margin-bottom:10px; font-size:13px; }
  table.standings th, table.standings td{ padding:7px 6px; text-align:center; border-bottom:1px solid var(--line); }
  table.standings th{ font-size:11px; text-transform:uppercase; color:#54607a; }
  table.standings td:first-child, table.standings th:first-child{ text-align:left; }
  table.standings tr:first-child td{ font-weight:700; }

  .matchlist{ display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  .matchrow{ display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;}
  .matchrow .names{ flex:1; }
  .matchrow .score{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .matchrow .win{ color:var(--green); font-weight:700; }

  .ko-round{ margin-bottom:14px; }
  .ko-round h4{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--red); margin:0 0 6px; }

  .champion-banner{
    background:linear-gradient(135deg,var(--gold),var(--orange)); color:var(--ink);
    border-radius:12px; padding:14px; text-align:center; margin-bottom:14px;
  }
  .champion-banner .label{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; }
  .champion-banner .name{ font-family:'Anton',sans-serif; font-size:24px; margin-top:2px; }

  .summary-grid{ display:flex; flex-direction:column; gap:10px; }
  .summary-card{ display:flex; align-items:center; gap:12px; background:#fff; border:1.5px solid var(--line);
    border-radius:12px; padding:12px 14px; }
  .summary-card .dot{ width:38px;height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif; color:var(--paper); font-size:16px; flex:0 0 auto; }
  .summary-card .info{ flex:1; }
  .summary-card .info .g{ font-weight:700; font-size:15px; }
  .summary-card .info .s{ font-size:12.5px; color:#54607a; }
  .summary-card .champ{ font-size:12px; font-weight:700; text-align:right; }
  .summary-card .champ .tag{ font-size:9.5px; text-transform:uppercase; color:#54607a; display:block; font-weight:600; }

  .empty{ font-size:13px; color:#7c8598; padding:6px 2px 2px; }
  .note{ font-size:11.5px; color:rgba(250,243,220,.65); text-align:center; margin-top:6px; line-height:1.5; }

  .bigdot svg, .dot svg{ width:58%; height:58%; display:block; }

  .lockbadge{
    position:fixed; top:14px; right:14px; z-index:30;
    background:var(--paper); border:2px solid var(--gold); border-radius:999px;
    padding:7px 12px; font-size:12.5px; font-weight:700; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.25); color:var(--ink);
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,56,34,.62); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-card{
    background:var(--paper); border-radius:16px; padding:22px; width:100%; max-width:320px;
    border:1.5px solid var(--ink);
  }
  .modal-card h3{ font-family:'Anton',sans-serif; text-transform:uppercase; font-size:19px; margin:0 0 8px; }
  .modal-desc{ font-size:12.5px; color:#54607a; margin:0 0 14px; line-height:1.5; }
  .modal-card input{ text-align:center; font-size:18px; letter-spacing:.08em; margin-bottom:8px; }
  .pin-error{ color:var(--red); font-size:12px; font-weight:600; margin-bottom:8px; }
  .modal-actions{ display:flex; gap:8px; margin-top:6px; }
  .modal-actions .btn{ flex:1; }

  .home-link.tv-link{ margin-top:8px; color:#54607a; text-decoration:none; font-size:12.5px; }

  /* ---- TV MODE ---- */
  .tv-root{
    position:fixed; inset:0; background:var(--ink); color:var(--paper);
    padding:3vh 4vw; display:flex; flex-direction:column; overflow-y:auto;
  }
  .tv-exit{
    position:fixed; top:18px; right:22px; background:rgba(255,255,255,.12); color:var(--paper);
    border:2px solid rgba(255,255,255,.4); border-radius:999px; padding:8px 16px; font-size:14px;
    font-weight:700; cursor:pointer; z-index:5;
  }
  .tv-header{ display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:2vh; }
  .tv-arrow{
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.4); color:var(--paper);
    border-radius:50%; width:56px; height:56px; font-size:26px; cursor:pointer; flex:0 0 auto;
  }
  .tv-title{ display:flex; align-items:center; gap:16px; }
  .tv-logo{ width:56px; height:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,.4)); flex:0 0 auto; }
  .tv-title .bigdot{ width:64px;height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif; font-size:28px; color:var(--paper); flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 0 0 5px rgba(255,255,255,.2); }
  .tv-title h1{ font-family:'Anton',sans-serif; text-transform:uppercase; font-size:clamp(34px,6vw,64px); margin:0; }

  .tv-champion{
    background:linear-gradient(135deg,var(--gold),var(--orange)); color:var(--ink);
    border-radius:18px; padding:2.2vh 2vw; text-align:center; margin-bottom:2.5vh;
  }
  .tv-champion .label{ font-size:clamp(14px,1.6vw,20px); text-transform:uppercase; letter-spacing:.12em; font-weight:700; }
  .tv-champion .name{ font-family:'Anton',sans-serif; font-size:clamp(30px,5vw,54px); margin-top:4px; }

  .tv-section-title{ font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:.03em;
    font-size:clamp(20px,2.6vw,30px); color:var(--gold); margin:1.6vh 0 1vh; }

  .tv-groups{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:2vw; margin-bottom:1vh; }
  .tv-group-card{ background:rgba(255,255,255,.06); border-radius:14px; padding:1.6vh 1.4vw; }
  .tv-group-card h3{ font-family:'Anton',sans-serif; text-transform:uppercase; font-size:clamp(18px,2.2vw,24px);
    margin:0 0 10px; color:var(--paper); }
  table.tv-standings{ width:100%; border-collapse:collapse; font-size:clamp(15px,1.7vw,20px); }
  table.tv-standings th{ text-transform:uppercase; font-size:clamp(10px,1vw,13px); color:rgba(255,255,255,.55);
    text-align:center; padding:6px 4px; }
  table.tv-standings th:first-child{ text-align:left; }
  table.tv-standings td{ padding:8px 4px; text-align:center; border-top:1px solid rgba(255,255,255,.12); }
  table.tv-standings td:first-child{ text-align:left; font-weight:600; }
  table.tv-standings tr:first-child td{ color:var(--gold); font-weight:700; }

  .tv-ko{ display:flex; flex-wrap:wrap; gap:2vw; }
  .tv-ko-round{ flex:1 1 220px; }
  .tv-ko-round h4{ font-family:'Anton',sans-serif; text-transform:uppercase; font-size:clamp(14px,1.6vw,18px);
    color:rgba(255,255,255,.6); margin:0 0 8px; }
  .tv-matchrow{ background:rgba(255,255,255,.06); border-radius:10px; padding:10px 14px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; font-size:clamp(14px,1.6vw,19px); gap:10px; }
  .tv-matchrow .win{ color:var(--gold); font-weight:700; }
  .tv-matchrow .score{ font-family:'IBM Plex Mono',monospace; font-weight:700; }
  .tv-empty{ font-size:clamp(14px,1.6vw,19px); color:rgba(255,255,255,.55); }
</style>
</head>

async function dbGet(key){
  const { data, error } = await sbClient.from('torneo_storage').select('value').eq('key', key).maybeSingle();
  if(error) throw new Error(error.message || JSON.stringify(error));
  return data ? data.value : null;
}

  const { error } = await sbClient.from('torneo_storage').upsert({ key, value, updated_at: new Date().toISOString() });
  if(error) throw new Error(error.message || JSON.stringify(error));
}

function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function pairDisplayName(p){
  if(!p) return '—';
  if(p.j1nombre || p.j2nombre){
    const n1 = `${p.j1nombre||''} ${p.j1apellidos||''}`.trim();
    const n2 = `${p.j2nombre||''} ${p.j2apellidos||''}`.trim();
    return `${n1} & ${n2}`;
  }
  return p.nombre || '—'; // backwards compatibility with older data
}

function defaultGameState(){
  return { pairs: [], groups: ['A','B'], groupMatches: [], koMatches: [],
    settings: { fecha:'', hora:'', lugar:'', notas:'' } };
}
function defaultState(){
  const games = {};
  Object.keys(GAMES).forEach(k => games[k] = defaultGameState());
  return { games };
}

let dataLoadError = null;

async function loadData(){
  try{
    const val = await dbGet(STORAGE_KEY);
    state = val ? JSON.parse(val) : defaultState();
    dataLoadError = null;
  }catch(e){
    console.error('Error cargando', e);
    dataLoadError = (e && e.message) ? e.message : String(e);
    state = state || defaultState();
  }
  // backfill in case new games were added later
  Object.keys(GAMES).forEach(k => {
    if(!state.games[k]) state.games[k] = defaultGameState();
    if(!state.games[k].settings) state.games[k].settings = { fecha:'', hora:'', lugar:'', notas:'' };
  });
}

function renderErrorBanner(){
  if(!dataLoadError) return '';
  return `<div style="background:#C1272D;color:#FAF3DC;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;font-weight:600;">
    ⚠️ No se pudo conectar con la base de datos: ${esc(dataLoadError)}
  </div>`;
}

let saving = false;
async function saveData(){
  try{
    await dbSet(STORAGE_KEY, JSON.stringify(state));
    dataLoadError = null;
  }catch(e){
    console.error('Error guardando', e);
    dataLoadError = 'no se pudo guardar (' + ((e && e.message) ? e.message : String(e)) + ')';
  }
}

async function loadPinState(){
  try{
    pinConfigured = await dbGet(PIN_KEY);
  }catch(e){ pinConfigured = null; }
  unlocked = localStorage.getItem(PIN_UNLOCKED_KEY) === 'true';
}

function updateLockBadge(){
  const b = document.getElementById('lockBadge');
  if(!b) return;
  b.textContent = unlocked ? '🔓 Editar' : '🔒 Bloqueado';
}

function showPinModal(onSuccess){
  const configuring = !pinConfigured;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h3>${configuring ? 'Crea un PIN de edición' : 'Introduce el PIN'}</h3>
      <p class="modal-desc">${configuring
        ? 'Este PIN lo usará el equipo organizador para poder añadir o borrar resultados. Compartidlo solo entre vosotros.'
        : 'Pide el PIN a la organización para poder editar resultados. Solo hace falta una vez por dispositivo.'}</p>
      <input type="text" inputmode="numeric" id="pinInput" placeholder="PIN" autocomplete="off">
      <div id="pinError" class="pin-error" style="display:none;">PIN incorrecto, inténtalo otra vez.</div>
      <div class="modal-actions">
        <button class="btn secondary" id="pinCancel" type="button">Cancelar</button>
        <button class="btn" id="pinConfirm" type="button">${configuring ? 'Guardar PIN' : 'Entrar'}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('pinInput').focus();
  document.getElementById('pinInput').addEventListener('keydown', ev => {
    if(ev.key === 'Enter'){ ev.preventDefault(); document.getElementById('pinConfirm').click(); }
  });
  document.getElementById('pinCancel').onclick = () => { root.innerHTML = ''; };
  document.getElementById('pinConfirm').onclick = async () => {
    const val = document.getElementById('pinInput').value.trim();
    if(!val) return;
    if(configuring){
      pinConfigured = val;
      await dbSet(PIN_KEY, val);
      unlocked = true;
      localStorage.setItem(PIN_UNLOCKED_KEY, 'true');
      root.innerHTML = '';
      updateLockBadge();
      if(onSuccess) onSuccess();
    } else if(val === pinConfigured){
      unlocked = true;
      localStorage.setItem(PIN_UNLOCKED_KEY, 'true');
      root.innerHTML = '';
      updateLockBadge();
      if(onSuccess) onSuccess();
    } else {
      document.getElementById('pinError').style.display = 'block';
    }
  };
}

function pairName(game, id){
  const p = state.games[game].pairs.find(p => p.id === id);
  return pairDisplayName(p);
}

function computeStandings(game, grupo){
  const g = state.games[game];
  const pairs = g.pairs.filter(p => p.grupo === grupo);
  const stats = {};
  pairs.forEach(p => stats[p.id] = { id:p.id, nombre:pairDisplayName(p), pj:0, g:0, pf:0, pc:0 });
  g.groupMatches.filter(m => m.grupo === grupo).forEach(m => {
    if(!stats[m.pair1] || !stats[m.pair2]) return;
    stats[m.pair1].pj++; stats[m.pair2].pj++;
    stats[m.pair1].pf += m.score1; stats[m.pair1].pc += m.score2;
    stats[m.pair2].pf += m.score2; stats[m.pair2].pc += m.score1;
    if(m.score1 > m.score2) stats[m.pair1].g++;
    else if(m.score2 > m.score1) stats[m.pair2].g++;
  });
  return Object.values(stats).sort((a,b) => (b.g - a.g) || ((b.pf-b.pc) - (a.pf-a.pc)) || (b.pf - a.pf));
}

function render(){
  renderBunting();
  const app = document.getElementById('app');
  if(currentTab === 'home'){
    app.innerHTML = renderErrorBanner() + renderHome();
  } else if(currentTab === 'resumen'){
    app.innerHTML = renderErrorBanner() + renderTopBar('Resumen') + renderResumen();
  } else {
    const meta = GAMES[currentTab];
    app.innerHTML = renderErrorBanner() + renderTopBar(meta.name, meta.color, meta.icon) + renderGamePage(currentTab);
  }
}

function renderBunting(){
  const el = document.getElementById('bunting');
  if(el.childElementCount) return;
  const colors = ['p-red','p-gold','p-ink','p-orange'];
  let html = '';
  for(let i=0;i<26;i++) html += `<span class="pennant ${colors[i%4]}"></span>`;
  el.innerHTML = html;
}

function renderTopBar(title, color, icon){
  return `<div class="topbar">
    <button class="backbtn" data-tab="home">← Torneos</button>
    <div class="topbar-title">${icon?`<span class="dot small" style="background:${color}">${icon}</span>`:''}${title}</div>
    ${title!=='Resumen' ? `<button class="linkbtn" data-tab="resumen">Resumen</button>` : ''}
  </div>`;
}

function renderHome(){
  let html = `<div class="home-grid">`;
  Object.entries(GAMES).forEach(([key,meta]) => {
    const g = state.games[key];
    const champ = getChampion(key);
    const status = champ ? `🏆 ${esc(champ)}` : `${g.pairs.length} pareja${g.pairs.length===1?'':'s'}`;
    html += `<button class="homebtn" data-tab="${key}">
      <span class="bigdot" style="background:${meta.color}">${meta.icon}</span>
      <span class="gname">${meta.name}</span>
      <span class="gstatus">${status}</span>
    </button>`;
  });
  html += `</div><button class="home-link" data-tab="resumen">Ver resumen general</button>
    <button class="home-link tv-link" id="tvModeBtn">📺 Modo TV</button>`;
  return html;
}

function getChampion(game){
  const final = state.games[game].koMatches.find(m => m.ronda === 'Final' && m.played);
  if(!final) return null;
  if(final.score1 === final.score2) return null;
  const winId = final.score1 > final.score2 ? final.pair1 : final.pair2;
  return pairName(game, winId);
}

function renderResumen(){
  let html = `<div class="summary-grid">`;
  Object.entries(GAMES).forEach(([key,meta]) => {
    const g = state.games[key];
    const champ = getChampion(key);
    html += `<div class="summary-card">
      <div class="dot" style="background:${meta.color}">${meta.icon}</div>
      <div class="info">
        <div class="g">${meta.name}</div>
        <div class="s">${g.pairs.length} pareja${g.pairs.length===1?'':'s'} inscrita${g.pairs.length===1?'':'s'}</div>
      </div>
      <div class="champ">
        ${champ ? `<span class="tag">Campeones</span>🏆 ${esc(champ)}` : `<span class="tag">Estado</span>En juego`}
      </div>
    </div>`;
  });
  html += `</div><div class="note">Cualquiera puede apuntarse a un torneo. Meter resultados y gestionar grupos, fechas y formato requiere el PIN de organización.</div>`;
  return html;
}

function renderGamePage(game){
  const meta = GAMES[game];
  const sub = gameSubTab[game];
  const s = state.games[game].settings;
  let html = '';
  if(s.fecha || s.hora || s.lugar){
    const parts = [s.fecha, s.hora, s.lugar].filter(Boolean).map(esc);
    html += `<div class="note" style="margin:-2px 0 10px;">📅 ${parts.join(' · ')}</div>`;
  }
  html += `<div class="subtabbar">
    <button class="subtab ${sub==='apuntarse'?'active':''}" data-subtab="apuntarse" data-game="${game}">Apuntarse</button>
    <button class="subtab ${sub==='grupos'?'active':''}" data-subtab="grupos" data-game="${game}">Grupos</button>
    <button class="subtab ${sub==='eliminatoria'?'active':''}" data-subtab="eliminatoria" data-game="${game}">Eliminatoria</button>
    <button class="subtab ${sub==='ajustes'?'active':''}" data-subtab="ajustes" data-game="${game}">Ajustes</button>
  </div>`;
  if(sub === 'apuntarse') html += renderApuntarse(game);
  else if(sub === 'grupos') html += renderGroups(game);
  else if(sub === 'eliminatoria') html += renderKnockout(game);
  else html += renderAjustes(game);
  return html;
}

function renderApuntarse(game){
  const g = state.games[game];
  let html = `<div class="card">
    <h2>Apúntate a ${GAMES[game].name}</h2>
    <p style="font-size:12.5px;color:#54607a;margin:-6px 0 12px;">Se juega en parejas. Escribe el nombre y apellidos de los dos jugadores.</p>
    <form data-action="register-pair" data-game="${game}">
      <div class="row">
        <div class="field"><label>Jugador 1 — Nombre</label><input name="j1nombre" required></div>
        <div class="field"><label>Jugador 1 — Apellidos</label><input name="j1apellidos" required></div>
      </div>
      <div class="row" style="margin-top:8px;">
        <div class="field"><label>Jugador 2 — Nombre</label><input name="j2nombre" required></div>
        <div class="field"><label>Jugador 2 — Apellidos</label><input name="j2apellidos" required></div>
      </div>
      <button class="btn" type="submit" style="margin-top:10px;">Apuntar pareja</button>
    </form>
  </div>`;

  const sinGrupo = g.pairs.filter(p => !p.grupo);
  const totalInscritas = g.pairs.length;
  html += `<div class="card"><h3>Parejas apuntadas — ${totalInscritas}</h3>`;
  if(totalInscritas === 0){
    html += `<div class="empty">Todavía no se ha apuntado nadie.</div></div>`;
  } else {
    g.groups.forEach(gr => {
      const pairs = g.pairs.filter(p => p.grupo === gr);
      if(pairs.length === 0) return;
      html += `<h3 style="margin-top:14px;">Grupo ${gr}</h3><div class="chips">` + pairs.map(p => `
        <span class="chip">${esc(pairDisplayName(p))}
          <button class="iconbtn" data-action="delete-pair" data-game="${game}" data-id="${p.id}" title="Eliminar">✕</button>
        </span>`).join('') + `</div>`;
    });
    if(sinGrupo.length){
      html += `<h3 style="margin-top:14px;">Sin grupo asignado todavía</h3>`;
      const groupOptions = g.groups.map(gr => `<option value="${gr}">Grupo ${gr}</option>`).join('');
      html += `<div class="matchlist">` + sinGrupo.map(p => `
        <form class="matchrow" data-action="assign-group" data-game="${game}" data-id="${p.id}" style="flex-wrap:wrap;">
          <span class="names">${esc(pairDisplayName(p))}</span>
          <select name="grupo" style="width:auto;flex:0 0 auto;">${groupOptions}</select>
          <button class="btn small" type="submit">Asignar</button>
          <button class="iconbtn" type="button" data-action="delete-pair" data-game="${game}" data-id="${p.id}" title="Eliminar">✕</button>
        </form>`).join('') + `</div>
        <p style="font-size:11.5px;color:#7c8598;margin-top:8px;">La organización asigna el grupo de cada pareja (requiere PIN).</p>`;
    }
    html += `</div>`;
  }
  html += `<div style="text-align:center;"><button class="btn secondary small" data-action="add-group" data-game="${game}">+ Añadir grupo</button></div>`;
  return html;
}

function renderGroups(game){
  const g = state.games[game];
  let html = '';
  if(g.pairs.length === 0){
    return `<div class="card"><div class="empty">Añade parejas primero en la pestaña «Parejas» para poder registrar resultados de grupo.</div></div>`;
  }
  g.groups.forEach(gr => {
    const pairsInGroup = g.pairs.filter(p => p.grupo === gr);
    const standings = computeStandings(game, gr);
    const matches = g.groupMatches.filter(m => m.grupo === gr);
    html += `<div class="card"><h2>Grupo ${gr}</h2>`;
    if(pairsInGroup.length < 2){
      html += `<div class="empty">Se necesitan al menos 2 parejas en este grupo.</div></div>`;
      return;
    }
    html += `<table class="standings"><thead><tr>
      <th>Pareja</th><th>PJ</th><th>G</th><th>PF</th><th>PC</th><th>Dif</th>
    </tr></thead><tbody>`;
    standings.forEach(s => {
      html += `<tr><td>${esc(s.nombre)}</td><td>${s.pj}</td><td>${s.g}</td><td>${s.pf}</td><td>${s.pc}</td><td>${s.pf-s.pc>0?'+':''}${s.pf-s.pc}</td></tr>`;
    });
    html += `</tbody></table>`;

    const pairOptions = pairsInGroup.map(p => `<option value="${p.id}">${esc(pairDisplayName(p))}</option>`).join('');
    html += `<form class="row" data-action="add-groupmatch" data-game="${game}" data-grupo="${gr}">
      <div class="field"><label>Pareja 1</label><select name="pair1" required>${pairOptions}</select></div>
      <div class="field" style="flex:0 0 70px;"><label>Pts</label><input type="number" name="score1" required></div>
      <div class="field"><label>Pareja 2</label><select name="pair2" required>${pairOptions}</select></div>
      <div class="field" style="flex:0 0 70px;"><label>Pts</label><input type="number" name="score2" required></div>
      <button class="btn" type="submit">Guardar</button>
    </form>`;

    if(matches.length){
      html += `<div class="matchlist">` + matches.map(m => `
        <div class="matchrow">
          <span class="names">${m.score1>m.score2?'<span class=\"win\">':''}${esc(pairName(game,m.pair1))}${m.score1>m.score2?'</span>':''}
            vs
            ${m.score2>m.score1?'<span class=\"win\">':''}${esc(pairName(game,m.pair2))}${m.score2>m.score1?'</span>':''}</span>
          <span class="score">${m.score1} – ${m.score2}</span>
          <button class="iconbtn" data-action="delete-groupmatch" data-game="${game}" data-id="${m.id}">✕</button>
        </div>`).join('') + `</div>`;
    }
    html += `</div>`;
  });
  return html;
}

function renderKnockout(game){
  const g = state.games[game];
  const champ = getChampion(game);
  let html = '';
  if(champ){
    html += `<div class="champion-banner"><div class="label">Campeones ${GAMES[game].name}</div><div class="name">🏆 ${esc(champ)}</div></div>`;
  }
  const assignedPairs = g.pairs.filter(p => p.grupo);
  if(assignedPairs.length < 2){
    return html + `<div class="card"><div class="empty">Necesitas al menos 2 parejas asignadas a un grupo para crear cruces de eliminatoria.</div></div>`;
  }
  const pairOptions = assignedPairs.map(p => `<option value="${p.id}">${esc(pairDisplayName(p))} (Grupo ${p.grupo})</option>`).join('');
  html += `<div class="card">
    <h2>Añadir cruce</h2>
    <form class="row" data-action="add-komatch" data-game="${game}">
      <div class="field" style="flex:1 1 140px;">
        <label>Ronda</label>
        <select name="ronda">${ROUND_ORDER.map(r=>`<option value="${r}">${r}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Pareja 1</label><select name="pair1" required>${pairOptions}</select></div>
      <div class="field" style="flex:0 0 70px;"><label>Pts</label><input type="number" name="score1" required></div>
      <div class="field"><label>Pareja 2</label><select name="pair2" required>${pairOptions}</select></div>
      <div class="field" style="flex:0 0 70px;"><label>Pts</label><input type="number" name="score2" required></div>
      <button class="btn" type="submit">Guardar cruce</button>
    </form>
  </div>`;

  const byRound = {};
  g.koMatches.forEach(m => { (byRound[m.ronda] = byRound[m.ronda] || []).push(m); });
  const roundsPresent = ROUND_ORDER.filter(r => byRound[r] && byRound[r].length);
  if(roundsPresent.length === 0){
    html += `<div class="card"><div class="empty">Todavía no hay cruces registrados.</div></div>`;
  } else {
    html += `<div class="card">`;
    roundsPresent.forEach(r => {
      html += `<div class="ko-round"><h4>${r}</h4><div class="matchlist">`;
      byRound[r].forEach(m => {
        html += `<div class="matchrow">
          <span class="names">${m.score1>m.score2?'<span class=\"win\">':''}${esc(pairName(game,m.pair1))}${m.score1>m.score2?'</span>':''}
            vs
            ${m.score2>m.score1?'<span class=\"win\">':''}${esc(pairName(game,m.pair2))}${m.score2>m.score1?'</span>':''}</span>
          <span class="score">${m.score1} – ${m.score2}</span>
          <button class="iconbtn" data-action="delete-komatch" data-game="${game}" data-id="${m.id}">✕</button>
        </div>`;
      });
      html += `</div></div>`;
    });
    html += `</div>`;
  }
  return html;
}

function renderAjustes(game){
  const s = state.games[game].settings;
  const hasAny = s.fecha || s.hora || s.lugar || s.notas;
  let html = `<div class="card">
    <h2>Ajustes de ${GAMES[game].name}</h2>
    <p style="font-size:12.5px;color:#54607a;margin:-6px 0 12px;">Fecha, hora, lugar y formato del torneo. Solo la organización puede cambiarlos (PIN).</p>`;
  if(hasAny){
    html += `<table class="standings" style="margin-bottom:14px;"><tbody>
      ${s.fecha ? `<tr><td>Fecha</td><td style="text-align:right;">${esc(s.fecha)}</td></tr>` : ''}
      ${s.hora ? `<tr><td>Hora</td><td style="text-align:right;">${esc(s.hora)}</td></tr>` : ''}
      ${s.lugar ? `<tr><td>Lugar</td><td style="text-align:right;">${esc(s.lugar)}</td></tr>` : ''}
      ${s.notas ? `<tr><td>Formato / notas</td><td style="text-align:right;">${esc(s.notas)}</td></tr>` : ''}
    </tbody></table>`;
  } else {
    html += `<div class="empty">Todavía no hay fecha ni formato definidos para este torneo.</div>`;
  }
  html += `<form data-action="save-settings" data-game="${game}">
      <div class="row">
        <div class="field"><label>Fecha</label><input type="date" name="fecha" value="${esc(s.fecha)}"></div>
        <div class="field"><label>Hora</label><input type="time" name="hora" value="${esc(s.hora)}"></div>
      </div>
      <div class="row" style="margin-top:8px;">
        <div class="field"><label>Lugar</label><input name="lugar" value="${esc(s.lugar)}" placeholder="Ej. Casal Faller"></div>
      </div>
      <div class="row" style="margin-top:8px;">
        <div class="field"><label>Formato / notas</label><input name="notas" value="${esc(s.notas)}" placeholder="Ej. Grupos de 4, dos mejores de tres"></div>
      </div>
      <button class="btn" type="submit" style="margin-top:10px;">Guardar ajustes</button>
    </form>
  </div>`;
  return html;
}

// ---- event delegation ----
document.addEventListener('click', e => {
  const tvBtn = e.target.closest('#tvModeBtn');
  if(tvBtn){ enterTVMode(); return; }

  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ currentTab = tabBtn.dataset.tab; render(); return; }

  const subBtn = e.target.closest('[data-subtab]');
  if(subBtn){ gameSubTab[subBtn.dataset.game] = subBtn.dataset.subtab; render(); return; }

  const addGroupBtn = e.target.closest('[data-action="add-group"]');
  if(addGroupBtn){
    const run = () => {
      const game = addGroupBtn.dataset.game;
      const groups = state.games[game].groups;
      const nextCode = String.fromCharCode(65 + groups.length);
      groups.push(nextCode);
      saveData(); render();
    };
    unlocked ? run() : showPinModal(run);
    return;
  }

  const delPair = e.target.closest('[data-action="delete-pair"]');
  if(delPair){
    const run = () => {
      const {game, id} = delPair.dataset;
      const g = state.games[game];
      g.pairs = g.pairs.filter(p => p.id !== id);
      g.groupMatches = g.groupMatches.filter(m => m.pair1 !== id && m.pair2 !== id);
      g.koMatches = g.koMatches.filter(m => m.pair1 !== id && m.pair2 !== id);
      saveData(); render();
    };
    unlocked ? run() : showPinModal(run);
    return;
  }

  const delGm = e.target.closest('[data-action="delete-groupmatch"]');
  if(delGm){
    const run = () => {
      const {game, id} = delGm.dataset;
      state.games[game].groupMatches = state.games[game].groupMatches.filter(m => m.id !== id);
      saveData(); render();
    };
    unlocked ? run() : showPinModal(run);
    return;
  }

  const delKo = e.target.closest('[data-action="delete-komatch"]');
  if(delKo){
    const run = () => {
      const {game, id} = delKo.dataset;
      state.games[game].koMatches = state.games[game].koMatches.filter(m => m.id !== id);
      saveData(); render();
    };
    unlocked ? run() : showPinModal(run);
    return;
  }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-action]');
  if(!form) return;
  e.preventDefault();
  const action = form.dataset.action;
  const game = form.dataset.game;
  const fd = new FormData(form);

  // Public: signing up a pair never requires the PIN.
  if(action === 'register-pair'){
    const j1nombre = (fd.get('j1nombre')||'').trim();
    const j1apellidos = (fd.get('j1apellidos')||'').trim();
    const j2nombre = (fd.get('j2nombre')||'').trim();
    const j2apellidos = (fd.get('j2apellidos')||'').trim();
    if(!j1nombre || !j1apellidos || !j2nombre || !j2apellidos) return;
    state.games[game].pairs.push({ id: uid(), j1nombre, j1apellidos, j2nombre, j2apellidos, grupo: null });
    form.reset();
    saveData();
    render();
    return;
  }

  // Everything else here is organization-only.
  const run = () => {
    if(action === 'assign-group'){
      const id = form.dataset.id;
      const grupo = fd.get('grupo');
      const p = state.games[game].pairs.find(p => p.id === id);
      if(p) p.grupo = grupo;
    }

    if(action === 'save-settings'){
      state.games[game].settings = {
        fecha: (fd.get('fecha')||'').trim(),
        hora: (fd.get('hora')||'').trim(),
        lugar: (fd.get('lugar')||'').trim(),
        notas: (fd.get('notas')||'').trim()
      };
    }

    if(action === 'add-groupmatch'){
      const grupo = form.dataset.grupo;
      const pair1 = fd.get('pair1'), pair2 = fd.get('pair2');
      const score1 = Number(fd.get('score1')), score2 = Number(fd.get('score2'));
      if(pair1 === pair2){ alert('Elige dos parejas distintas.'); return; }
      state.games[game].groupMatches.push({ id: uid(), grupo, pair1, pair2, score1, score2 });
    }

    if(action === 'add-komatch'){
      const ronda = fd.get('ronda');
      const pair1 = fd.get('pair1'), pair2 = fd.get('pair2');
      const score1 = Number(fd.get('score1')), score2 = Number(fd.get('score2'));
      if(pair1 === pair2){ alert('Elige dos parejas distintas.'); return; }
      state.games[game].koMatches.push({ id: uid(), ronda, pair1, pair2, score1, score2, played:true });
    }

    saveData();
    render();
  };

  unlocked ? run() : showPinModal(run);
});

document.getElementById('lockBadge').addEventListener('click', () => {
  if(unlocked){
    if(confirm('¿Bloquear la edición en este dispositivo? Habrá que volver a introducir el PIN.')){
      unlocked = false;
      window.localStorage.setItem(PIN_UNLOCKED_KEY, 'false');
      updateLockBadge();
    }
  } else {
    showPinModal(() => {});
  }
});

async function init(){
  await loadData();
  await loadPinState();
  render();
  updateLockBadge();
}
init();

// ---- TV MODE ----
let tvMode = false;
let tvGameIndex = 0;
let tvPollInterval = null;
const tvGameKeys = Object.keys(GAMES);

function enterTVMode(){
  tvMode = true;
  document.getElementById('normalRoot').style.display = 'none';
  document.getElementById('tvRoot').style.display = 'flex';
  renderTV();
  if(!tvPollInterval){
    tvPollInterval = setInterval(async () => { await loadData(); if(tvMode) renderTV(); }, 6000);
  }
}

function exitTVMode(){
  tvMode = false;
  document.getElementById('tvRoot').style.display = 'none';
  document.getElementById('normalRoot').style.display = 'block';
  if(tvPollInterval){ clearInterval(tvPollInterval); tvPollInterval = null; }
  render();
}

function tvShiftGame(delta){
  tvGameIndex = (tvGameIndex + delta + tvGameKeys.length) % tvGameKeys.length;
  renderTV();
}

function renderTV(){
  const key = tvGameKeys[tvGameIndex];
  const meta = GAMES[key];
  const g = state.games[key];
  const champ = getChampion(key);
  const logoSrc = document.querySelector('.falla-logo') ? document.querySelector('.falla-logo').src : '';

  let html = `<button class="tv-exit" id="tvExitBtn">✕ Salir del modo TV</button>`;
  html += `<div class="tv-header">
    <button class="tv-arrow" id="tvPrev">‹</button>
    <div class="tv-title">
      ${logoSrc ? `<img src="${logoSrc}" class="tv-logo" alt="">` : ''}
      <span class="bigdot" style="background:${meta.color}">${meta.icon}</span>
      <h1>${meta.name}</h1>
    </div>
    <button class="tv-arrow" id="tvNext">›</button>
  </div>`;

  if(champ){
    html += `<div class="tv-champion"><div class="label">Campeones</div><div class="name">🏆 ${esc(champ)}</div></div>`;
  }

  if(g.pairs.length === 0){
    html += `<div class="tv-empty">Todavía no hay parejas inscritas en este torneo.</div>`;
  } else {
    html += `<div class="tv-section-title">Fase de grupos</div><div class="tv-groups">`;
    g.groups.forEach(gr => {
      const pairsInGroup = g.pairs.filter(p => p.grupo === gr);
      if(pairsInGroup.length === 0) return;
      const standings = computeStandings(key, gr);
      html += `<div class="tv-group-card"><h3>Grupo ${gr}</h3>
        <table class="tv-standings"><thead><tr><th>Pareja</th><th>PJ</th><th>G</th><th>Dif</th></tr></thead><tbody>`;
      standings.forEach(s => {
        html += `<tr><td>${esc(s.nombre)}</td><td>${s.pj}</td><td>${s.g}</td><td>${s.pf-s.pc>0?'+':''}${s.pf-s.pc}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    });
    html += `</div>`;

    const byRound = {};
    g.koMatches.forEach(m => { (byRound[m.ronda] = byRound[m.ronda] || []).push(m); });
    const roundsPresent = ROUND_ORDER.filter(r => byRound[r] && byRound[r].length);
    if(roundsPresent.length){
      html += `<div class="tv-section-title">Eliminatoria</div><div class="tv-ko">`;
      roundsPresent.forEach(r => {
        html += `<div class="tv-ko-round"><h4>${r}</h4>`;
        byRound[r].forEach(m => {
          html += `<div class="tv-matchrow">
            <span>${m.score1>m.score2?'<span class=\"win\">':''}${esc(pairName(key,m.pair1))}${m.score1>m.score2?'</span>':''}
              vs
              ${m.score2>m.score1?'<span class=\"win\">':''}${esc(pairName(key,m.pair2))}${m.score2>m.score1?'</span>':''}</span>
            <span class="score">${m.score1} – ${m.score2}</span>
          </div>`;
        });
        html += `</div>`;
      });
      html += `</div>`;
    }
  }

  const root = document.getElementById('tvRoot');
  root.innerHTML = html;
  document.getElementById('tvExitBtn').onclick = exitTVMode;
  document.getElementById('tvPrev').onclick = () => tvShiftGame(-1);
  document.getElementById('tvNext').onclick = () => tvShiftGame(1);
}

document.addEventListener('keydown', e => {
  if(!tvMode) return;
  if(e.key === 'ArrowLeft'){ tvShiftGame(-1); }
  else if(e.key === 'ArrowRight'){ tvShiftGame(1); }
  else if(e.key === 'Escape' || e.key === 'Backspace'){ exitTVMode(); }
});
</script>
</body>
</html>
